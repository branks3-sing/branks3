<!DOCTYPE html>
<html>
<head>
    <title>Karaoke Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #000000;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
        }

        .login-box { 
            background: rgba(5,10,25,0.95); 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%; 
            max-width: 400px; 
            text-align: center;
        }

        .logo { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.4); 
            margin-bottom: 20px; 
        }

        h2 { color: white; margin-bottom: 10px; }

        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            background-color: #000000 !important;
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 10px; 
            color: white !important; 
            font-size: 16px; 
            box-sizing: border-box;
        }

        input:focus { 
            outline: none; 
            border-color: rgba(255,255,255,0.6); 
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #000000 inset !important;
            box-shadow: 0 0 0 1000px #000000 inset !important;
            -webkit-text-fill-color: white !important;
        }

        /* Password container */
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
        }

        .toggle-password:hover {
            color: white;
        }

        .btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: none; 
            border-radius: 10px; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 20px;
        }

        .btn:hover { 
            opacity: 0.9; 
        }

        .error { color: #ff6666; margin-top: 10px; }

        .contact-links-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .contact-link-item {
            text-decoration: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.75rem !important;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .contact-link-item.email {
            color: #4285F4 !important;
            background: rgba(66, 133, 244, 0.1);
        }

        .contact-link-item.instagram {
            background: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        .contact-link-item.youtube {
            color: #FF0000 !important;
            background: rgba(255, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="/media/logo/branks3_logo.png" alt="Logo" class="logo" onerror="this.src='/static/default_logo.png'">
        <h2>𝄞 Sing Along </h2>
        <p style="color: #ccc; margin-bottom: 30px;">Login to continue</p>
        
        <form method="post" autocomplete="off">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Enter Username" required autocomplete="off">

            <div class="password-container">
                <input type="password" name="password" id="password" placeholder="Enter Password" required autocomplete="new-password">

                <span class="toggle-password" onclick="togglePassword()">
                    
                    <!-- Open Eye -->
                    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" 
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <!-- Closed Eye -->
                    <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" 
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         style="display:none;">
                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.86 21.86 0 0 1 5.06-7.94"/>
                        <path d="M1 1l22 22"/>
                        <path d="M9.88 9.88A3 3 0 1 0 14.12 14.12"/>
                    </svg>

                </span>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div style="margin-top:16px; font-size:0.8rem; color:#b5c2d2; text-align:center;">
            Don't have access? Contact admin:
        </div>

        <div class="contact-links-row">
            <a href="mailto:branks3.singalong@gmail.com" class="contact-link-item email" target="_blank">📧 Email</a>
            <a href="https://www.instagram.com/branks3.sing_along/" class="contact-link-item instagram" target="_blank">Instagram</a>
            <a href="https://www.youtube.com/@branks3.sing_along" class="contact-link-item youtube" target="_blank">YouTube</a>
        </div>
    </div>

<script>
function togglePassword() {
    var passwordInput = document.getElementById("password");
    var eyeOpen = document.getElementById("eyeOpen");
    var eyeClosed = document.getElementById("eyeClosed");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
    } else {
        passwordInput.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
    }
}
</script>

</body>
</html>

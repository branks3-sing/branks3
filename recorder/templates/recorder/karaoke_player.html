<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🎤 Sing Along · 9:16 Reel</title>
  <style>
    /* ----- GLOBAL RESET & FIXED LAYOUT ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #000;
      touch-action: manipulation;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    }

    /* main wrapper – 9:16 aspect ratio, fills screen with black bars if needed */
    .karaoke-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 360px;         /* typical mobile width */
      height: auto;
      aspect-ratio: 9 / 16;
      background: #0b0b0b;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 0 0 2px #222;
      display: flex;
      flex-direction: column;
    }

    /* image area – 75% of wrapper height */
    .reel-bg-container {
      flex: 3;                  /* 3 parts = 75% */
      position: relative;
      background: #000;
      min-height: 0;            /* important for flex child */
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #111;
    }

    /* logo – absolute inside image container */
    #logoImg {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 44px;
      height: 44px;
      z-index: 25;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
      pointer-events: none;
      border-radius: 8px;
    }

    /* controls area – 25% of wrapper */
    .controls-panel {
      flex: 1;                   /* 1 part = 25% */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px 12px;
      background: #121212;
      border-top: 1px solid #2a2a2a;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }

    /* unified button style */
    .action-btn {
      background: linear-gradient(145deg, #ff1a4c, #c2004b);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 20px;
      border-radius: 40px;
      min-width: 120px;
      box-shadow: 0 6px 12px rgba(220, 20, 80, 0.3);
      backdrop-filter: blur(2px);
      transition: all 0.08s linear;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      -webkit-appearance: none;
      flex: 1 1 auto;
      max-width: 160px;
    }

    .action-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
      box-shadow: 0 2px 6px rgba(220, 20, 80, 0.6);
    }

    .action-btn:disabled {
      opacity: 0.4;
      filter: grayscale(0.6);
      transform: none;
      pointer-events: none;
    }

    #stopBtn {
      background: linear-gradient(145deg, #3a3a3a, #1f1f1f);
      box-shadow: 0 4px 8px rgba(0,0,0,0.7);
      border: 1px solid #5a5a5a;
    }

    /* status text */
    #status {
      font-size: 0.85rem;
      color: #bbb;
      text-align: center;
      text-shadow: 0 1px 4px black;
      background: rgba(20,20,20,0.7);
      padding: 6px 16px;
      border-radius: 100px;
      backdrop-filter: blur(4px);
      width: fit-content;
      margin: 0 auto;
      border: 1px solid #333;
    }

    /* final output overlay (full wrapper) */
    .final-output {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.96);
      z-index: 200;
      display: none;
      flex-direction: column;
      backdrop-filter: blur(8px);
    }

    .final-output .reel-bg-container {
      flex: 3;
    }

    .final-output .controls-panel {
      flex: 1;
    }

    /* hidden canvas & video */
    canvas, #recordingVideoPlayer {
      display: none;
    }

    #recordingVideoPlayer[style*="block"] {
      display: block !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      z-index: 300;
    }

    .video-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 400;
      pointer-events: none;
    }

    .video-controls button {
      pointer-events: auto;
      background: rgba(30,30,30,0.9);
      border: 1px solid #ff4d6d;
      color: white;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    /* fallback text */
    .fallback-txt {
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    /* no overflow */
    .no-scroll {
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="karaoke-wrapper" id="karaokeWrapper">
    <!-- Image container (75%) -->
    <div class="reel-bg-container">
      {% if song.lyrics_image %}
      <img class="reel-bg" id="mainBg" src="{{ song.lyrics_image.url }}" alt="lyrics background">
      {% else %}
      <img class="reel-bg" id="mainBg" src="/static/default_lyrics_bg.jpg" alt="default bg">
      {% endif %}
      <img id="logoImg" src="/media/logo/branks3_logo.png" onerror="this.style.display='none'" alt="logo">
    </div>

    <!-- Controls panel (25%) -->
    <div class="controls-panel">
      <div id="status" class="status-indicator">🎤 Ready · tap a button</div>
      <div class="button-row">
        <button class="action-btn" id="playBtn">▶ Play original</button>
        <button class="action-btn" id="recordBtn">🎙 Start recording</button>
        <button class="action-btn" id="stopBtn" style="display: none;">⏹ Stop</button>
      </div>
    </div>

    <!-- hidden audio elements (only as fallback for preload) -->
    <audio id="originalAudio" preload="metadata" src="{{ song.original_file.url }}"></audio>
    <audio id="accompaniment" preload="metadata" src="{{ song.accompaniment_file.url }}"></audio>
  </div>

  <!-- final overlay after recording -->
  <div class="final-output" id="finalOutputDiv">
    <div class="reel-bg-container">
      <img class="reel-bg" id="finalBg" src="">
    </div>
    <div class="controls-panel">
      <div id="finalStatus" class="status-indicator">✅ Recording done</div>
      <div class="button-row">
        <button class="action-btn" id="playRecordingBtn">▶ Play</button>
        <a id="downloadRecordingBtn" download>
          <button class="action-btn">⬇ Download</button>
        </a>
        <button class="action-btn" id="newRecordingBtn">⟲ New</button>
      </div>
    </div>
  </div>

  <!-- video player + external controls -->
  <video id="recordingVideoPlayer" playsinline webkit-playsinline></video>
  <div class="video-controls" id="videoControls" style="display: none;">
    <button class="action-btn" onclick="window.closeVideoPlayer()">✖ Close</button>
    <button class="action-btn" onclick="window.toggleFullscreen()">⛶ Full</button>
  </div>

  <!-- hidden canvas for recording -->
  <canvas id="recordingCanvas" width="720" height="1280"></canvas>

  <script>
    (function() {
      "use strict";

      // ---------- GLOBAL STATE (clean & fast) ----------
      let audioContext = null;
      let originalAudioBuffer = null;
      let accompanimentBuffer = null;

      // UI elements
      const playBtn = document.getElementById('playBtn');
      const recordBtn = document.getElementById('recordBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusEl = document.getElementById('status');
      const finalDiv = document.getElementById('finalOutputDiv');
      const finalBg = document.getElementById('finalBg');
      const finalStatus = document.getElementById('finalStatus');
      const playRecordingBtn = document.getElementById('playRecordingBtn');
      const downloadRecordingBtn = document.getElementById('downloadRecordingBtn');
      const newRecordingBtn = document.getElementById('newRecordingBtn');
      const mainBg = document.getElementById('mainBg');
      const recordingVideoPlayer = document.getElementById('recordingVideoPlayer');
      const videoControls = document.getElementById('videoControls');
      const canvas = document.getElementById('recordingCanvas');
      const ctx = canvas.getContext('2d');
      const logoImgElem = document.getElementById('logoImg');

      // audio elements (only for preload)
      const originalAudioEl = document.getElementById('originalAudio');
      const accompanimentEl = document.getElementById('accompaniment');

      // recording related
      let mediaRecorder = null;
      let recordedChunks = [];
      let lastRecordingURL = null;
      let isRecording = false;
      let isPlayingOriginal = false;
      let recordingStartTime = 0;
      let autoStopTimer = null;
      let canvasAnimation = null;
      let micStream = null;

      // Web Audio nodes
      let micSource = null;
      let accSource = null;
      let originalSource = null;   // for play button (or monitoring)
      let micGain = null;
      let accGain = null;
      let monitorGain = null;       // original only to speakers
      let recordingDestination = null;

      // flags
      let buffersLoaded = false;
      let isShuttingDown = false;

      // ---------- HELPER: ensure AudioContext running (MUST be user triggered) ----------
      async function getAudioContext() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 48000,
            latencyHint: 'interactive'
          });
        }
        if (audioContext.state === 'suspended') {
          try { await audioContext.resume(); } catch (e) { console.warn('resume failed', e); }
        }
        return audioContext;
      }

      // ---------- LOAD AUDIO BUFFERS (once) ----------
      async function loadBuffers(force = false) {
        if (buffersLoaded && !force) return;
        const ctx = await getAudioContext();
        statusEl.innerText = '⏳ loading audio...';

        try {
          const [origResp, accResp] = await Promise.all([
            fetch(originalAudioEl.src),
            fetch(accompanimentEl.src)
          ]);
          const [origAB, accAB] = await Promise.all([
            origResp.arrayBuffer(),
            accResp.arrayBuffer()
          ]);
          originalAudioBuffer = await ctx.decodeAudioData(origAB);
          accompanimentBuffer = await ctx.decodeAudioData(accAB);
          buffersLoaded = true;
          statusEl.innerText = '🎤 Ready · play or record';
          console.log('buffers loaded', originalAudioBuffer.duration, accompanimentBuffer.duration);
        } catch (err) {
          statusEl.innerText = '❌ audio load failed';
          console.error(err);
          throw err;
        }
      }

      // ---------- DRAW CANVAS (background image + logo) ----------
      function startCanvasDrawing() {
        if (canvasAnimation) cancelAnimationFrame(canvasAnimation);
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          // background image (mainBg)
          const img = mainBg;
          if (img.complete && img.naturalWidth > 0) {
            const imgW = img.naturalWidth, imgH = img.naturalHeight;
            const canvasW = canvas.width, canvasH = canvas.height;
            const targetH = canvasH * 0.75; // top 75%
            const scale = Math.max(targetH / imgH, canvasW / imgW);
            const drawW = imgW * scale;
            const drawH = imgH * scale;
            const x = (canvasW - drawW) / 2;
            const y = 0;
            ctx.drawImage(img, x, y, drawW, drawH);
          } else {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.75);
          }
          // draw logo (top left)
          if (logoImgElem.complete && logoImgElem.naturalWidth > 0) {
            ctx.drawImage(logoImgElem, 20, 20, 60, 60);
          }
          canvasAnimation = requestAnimationFrame(draw);
        };
        draw();
      }

      function stopCanvasDrawing() {
        if (canvasAnimation) {
          cancelAnimationFrame(canvasAnimation);
          canvasAnimation = null;
        }
      }

      // ---------- CLEANUP RECORDING NODES ----------
      function cleanupRecordingNodes() {
        if (micSource) { try { micSource.disconnect(); } catch {} micSource = null; }
        if (accSource) { try { accSource.stop(); accSource.disconnect(); } catch {} accSource = null; }
        if (originalSource && !isPlayingOriginal) { try { originalSource.stop(); originalSource.disconnect(); } catch {} originalSource = null; }
        if (micGain) { try { micGain.disconnect(); } catch {} micGain = null; }
        if (accGain) { try { accGain.disconnect(); } catch {} accGain = null; }
        if (monitorGain) { try { monitorGain.disconnect(); } catch {} monitorGain = null; }
        if (recordingDestination) { try { recordingDestination.disconnect(); } catch {} recordingDestination = null; }
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
      }

      // ---------- STOP RECORDING (graceful) ----------
      function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        } else {
          // force cleanup if recorder not active
          finalizeRecordingAfterStop();
        }

        // stop canvas drawing, clean nodes
        stopCanvasDrawing();
        if (accSource) {
          try { accSource.stop(); } catch {}
        }
        cleanupRecordingNodes();

        // update UI
        stopBtn.style.display = 'none';
        playBtn.style.display = 'inline-block';
        recordBtn.style.display = 'inline-block';
        statusEl.innerText = '⏱ processing ...';
      }

      function finalizeRecordingAfterStop() {
        const duration = recordingStartTime ? (Date.now() - recordingStartTime) / 1000 : 0;
        if (recordedChunks.length === 0) {
          statusEl.innerText = '⚠ no recording data';
          resetMainUI();
          return;
        }
        const blob = new Blob(recordedChunks, { type: mediaRecorder ? mediaRecorder.mimeType : 'video/mp4' });
        const url = URL.createObjectURL(blob);
        if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
        lastRecordingURL = url;

        finalBg.src = mainBg.src;
        finalDiv.style.display = 'flex';
        finalStatus.innerText = `✅ recorded ${Math.floor(duration / 60)}:${Math.floor(duration % 10).toString().padStart(2,'0')}`;

        // file name
        const songTitle = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_') || 'karaoke';
        const ext = blob.type.includes('mp4') ? '.mp4' : '.webm';
        downloadRecordingBtn.href = url;
        downloadRecordingBtn.download = songTitle + '_KARAOKE' + ext;

        playRecordingBtn.onclick = () => {
          recordingVideoPlayer.src = url;
          recordingVideoPlayer.style.display = 'block';
          videoControls.style.display = 'flex';
          finalDiv.style.display = 'none';
          recordingVideoPlayer.play();
        };

        resetMainUI();
      }

      function resetMainUI() {
        playBtn.disabled = false;
        recordBtn.disabled = false;
        stopBtn.style.display = 'none';
        playBtn.style.display = 'inline-block';
        recordBtn.style.display = 'inline-block';
        statusEl.innerText = '🎤 Ready';
      }

      // ---------- RECORD BUTTON ----------
      recordBtn.onclick = async function (e) {
        e.preventDefault();
        if (isRecording) return;

        // stop any ongoing playback
        if (isPlayingOriginal && originalSource) {
          try { originalSource.stop(); originalSource.disconnect(); } catch {}
          isPlayingOriginal = false;
          playBtn.innerText = '▶ Play original';
        }

        try {
          await getAudioContext();
          if (!buffersLoaded) await loadBuffers();

          // request mic with high quality
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: true,
              autoGainControl: false,
              channelCount: 1,
              sampleRate: { ideal: 48000 }
            },
            video: false
          });

          // setup graph
          const ctx = audioContext;
          micSource = ctx.createMediaStreamSource(micStream);
          accSource = ctx.createBufferSource();
          accSource.buffer = accompanimentBuffer;

          // gains
          micGain = ctx.createGain();
          micGain.gain.value = 1.5;        // voice louder
          accGain = ctx.createGain();
          accGain.gain.value = 0.45;        // instrumental backing

          // for monitoring (original song) – NOT recorded
          monitorGain = ctx.createGain();
          monitorGain.gain.value = 1.0;
          const originalMonitorSource = ctx.createBufferSource();
          originalMonitorSource.buffer = originalAudioBuffer;
          originalSource = originalMonitorSource; // store for possible stop

          // destination for recording (mic + acc)
          recordingDestination = ctx.createMediaStreamDestination();

          // connections:
          // mic -> micGain -> recordingDestination + speakers (so singer hears themselves)
          micSource.connect(micGain);
          micGain.connect(recordingDestination);
          micGain.connect(ctx.destination);   // monitor to headphones

          // accompaniment -> accGain -> recordingDestination + speakers
          accSource.connect(accGain);
          accGain.connect(recordingDestination);
          accGain.connect(ctx.destination);

          // original (monitor) -> monitorGain -> speakers ONLY (not recorded)
          originalMonitorSource.connect(monitorGain);
          monitorGain.connect(ctx.destination);

          // start drawing canvas
          startCanvasDrawing();

          // start all sources synchronized
          const startTime = ctx.currentTime + 0.05; // tiny delay to ensure alignment
          accSource.start(startTime);
          originalMonitorSource.start(startTime);

          // canvas capture
          const canvasStream = canvas.captureStream(30);
          const mixedStream = recordingDestination.stream;
          const tracks = [...canvasStream.getVideoTracks(), ...mixedStream.getAudioTracks()];
          const combined = new MediaStream(tracks);

          // determine mime
          let mime = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
          if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp9,opus';
          if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

          mediaRecorder = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 5000000, audioBitsPerSecond: 256000 });
          recordedChunks = [];

          mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) recordedChunks.push(ev.data); };
          mediaRecorder.onstop = () => {
            finalizeRecordingAfterStop();
            cleanupRecordingNodes();
          };

          mediaRecorder.start(1000);
          isRecording = true;
          recordingStartTime = Date.now();

          // UI update
          playBtn.style.display = 'none';
          recordBtn.style.display = 'none';
          stopBtn.style.display = 'inline-block';
          statusEl.innerText = '🎙 Recording... sing!';

          // auto stop after accompaniment length
          autoStopTimer = setTimeout(() => {
            if (isRecording) stopRecording();
          }, (accompanimentBuffer.duration * 1000) + 500);

        } catch (err) {
          statusEl.innerText = '❌ mic error: ' + (err.message || 'denied');
          console.error(err);
          resetMainUI();
          cleanupRecordingNodes();
        }
      };

      // stop button
      stopBtn.onclick = () => stopRecording();

      // ---------- PLAY ORIGINAL (simple) ----------
      playBtn.onclick = async function () {
        try {
          await getAudioContext();
          if (!buffersLoaded) await loadBuffers();

          if (isPlayingOriginal && originalSource) {
            // stop
            try { originalSource.stop(); originalSource.disconnect(); } catch {}
            isPlayingOriginal = false;
            playBtn.innerText = '▶ Play original';
            statusEl.innerText = '⏹ stopped';
            return;
          }

          // create fresh source
          const src = audioContext.createBufferSource();
          src.buffer = originalAudioBuffer;
          src.connect(audioContext.destination);
          src.start();
          originalSource = src;
          isPlayingOriginal = true;
          playBtn.innerText = '⏹ Stop original';
          statusEl.innerText = '🎵 playing original';

          src.onended = () => {
            if (isPlayingOriginal) {
              isPlayingOriginal = false;
              playBtn.innerText = '▶ Play original';
              statusEl.innerText = '✅ finished';
            }
            originalSource = null;
          };
        } catch (err) {
          statusEl.innerText = '❌ playback error';
        }
      };

      // ---------- NEW RECORDING ----------
      newRecordingBtn.onclick = function () {
        if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
        lastRecordingURL = null;
        finalDiv.style.display = 'none';
        recordingVideoPlayer.style.display = 'none';
        videoControls.style.display = 'none';
        recordingVideoPlayer.pause();
        recordingVideoPlayer.src = '';
        resetMainUI();
        if (isPlayingOriginal && originalSource) {
          try { originalSource.stop(); originalSource.disconnect(); } catch {}
          isPlayingOriginal = false;
          playBtn.innerText = '▶ Play original';
        }
        recordedChunks = [];
      };

      // ---------- VIDEO PLAYER CONTROLS (global) ----------
      window.closeVideoPlayer = function () {
        recordingVideoPlayer.pause();
        recordingVideoPlayer.style.display = 'none';
        videoControls.style.display = 'none';
        finalDiv.style.display = 'flex';
      };

      window.toggleFullscreen = function () {
        if (!document.fullscreenElement) {
          recordingVideoPlayer.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      };

      // preload buffers as soon as context can be created (but after user touch)
      document.addEventListener('touchstart', async () => {
        await getAudioContext();
        loadBuffers().catch(() => {});
      }, { once: true });

      document.addEventListener('click', async () => {
        await getAudioContext();
        loadBuffers().catch(() => {});
      }, { once: true });

      // final cleanup
      window.addEventListener('beforeunload', () => {
        if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
        if (audioContext) audioContext.close();
        if (micStream) micStream.getTracks().forEach(t => t.stop());
      });

      // also preload metadata from audio tags (graceful)
      window.addEventListener('load', () => {
        statusEl.innerText = '🎤 tap screen';
      });

    })();
  </script>
</body>
</html>

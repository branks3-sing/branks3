<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎤 Sing Along</title>
  <link rel="icon" type="image/png" href="/media/logo/branks3_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      overflow: hidden !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      touch-action: manipulation;
    }
    body { 
      background: #000; 
      font-family: 'Poppins', sans-serif; 
      height: 100% !important;
      width: 100% !important;
      overflow: hidden !important;
      position: fixed !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .karaoke-wrapper {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background: #111 !important;
      overflow: hidden !important;
      aspect-ratio: 9 / 16 !important;
    }
    #status { 
      position: absolute; 
      top: 10px; 
      width: 100%; 
      text-align: center; 
      font-size: 12px; 
      color: #ccc; 
      z-index: 20; 
      text-shadow: 1px 1px 6px rgba(0,0,0,0.9); 
      padding: 5px;
    }
    .reel-bg { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important; 
      height: 75% !important;
      object-fit: contain !important;
      object-position: center !important;
    }
    .controls { 
      position: absolute; 
      top: 76% !important;
      left: 0;
      width: 100%;
      text-align: center; 
      z-index: 30; 
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 10px;
      box-sizing: border-box;
    }
    button { 
      background: linear-gradient(135deg, #ff0066, #ff66cc); 
      border: none; 
      color: white; 
      padding: 10px 15px; 
      border-radius: 20px; 
      font-size: 12px; 
      margin: 2px; 
      box-shadow: 0px 3px 15px rgba(255,0,128,0.4); 
      cursor: pointer; 
      min-width: 100px;
      flex: 1;
      max-width: 150px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      transition: transform 0.05s ease;
    }
    button:active { 
      transform: scale(0.95); 
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    #logoImg { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      width: 30px;
      height: 30px;
      z-index: 50; 
      opacity: 1;
      filter: brightness(1.2);
    }
    .final-output { 
      position: absolute !important; 
      width: 100% !important; 
      height: 100% !important; 
      top: 0 !important; 
      left: 0 !important; 
      background: rgba(0,0,0,0.95); 
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .audio-player {
      display: none;
    }
    #recordingVideoPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 1000;
    }
    .video-controls {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      z-index: 1001;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .video-controls button {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
    }
    canvas { 
      display: none; 
    }

    /* Final screen with three buttons in a row */
    .simple-controls {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 90%;
      max-width: 400px;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.8);
      border-radius: 20px;
      padding: 15px 20px;
      flex-wrap: wrap;
    }
    .simple-controls button {
      flex: 1;
      min-width: 90px;
      max-width: 130px;
      margin: 0;
      font-size: 12px;
    }
    /* Modal overlays for play/download options */
    .option-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1002;
      backdrop-filter: blur(4px);
    }
    .option-modal .modal-content {
      background: rgba(20,20,20,0.95);
      border-radius: 24px;
      padding: 20px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      border: 1px solid #ff66cc;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .option-modal h3 {
      color: white;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .option-modal .option-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0;
    }
    .option-modal .option-row button, 
    .option-modal .option-row a button {
      flex: 1;
      max-width: none;
      background: linear-gradient(135deg, #ff3388, #ff88cc);
      font-size: 11px;
      padding: 8px;
    }
    .close-modal {
      background: #666 !important;
      margin-top: 15px;
      box-shadow: none;
    }
    /* Draggable & resizable camera preview */
    .camera-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 101;
      display: none;
      cursor: grab;
      user-select: none;
    }
    .camera-container:active {
      cursor: grabbing;
    }
    .camera-container.visible {
      display: block;
    }
    #cameraPreview {
      display: block;
      width: 120px;
      height: 213px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background-color: #000;
      object-fit: cover;
      pointer-events: none;
      transform: scaleX(-1);  /* Mirror preview like a mirror */
    }
    .resize-handle {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      border: 1px solid #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      cursor: nw-resize;
      z-index: 102;
      pointer-events: auto;
      transition: transform 0.1s;
    }
    .resize-handle:active {
      transform: scale(1.1);
    }
    /* Hidden mirror canvas for flipped recording */
    #mirrorCanvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="karaoke-wrapper" id="karaokeWrapper">
    {% if song.lyrics_image %}
    <img class="reel-bg" id="mainBg" src="{{ song.lyrics_image.url }}">
    {% else %}
    <img class="reel-bg" id="mainBg" src="/static/default_lyrics_bg.jpg">
    {% endif %}

    <img id="logoImg" src="/media/logo/branks3_logo.png" onerror="this.style.display='none'">
    <div id="status">Ready 🎤</div>

    <audio id="originalAudio" class="audio-player" preload="auto" src="{{ song.original_file.url }}"></audio>
    <audio id="accompaniment" class="audio-player" preload="auto" src="{{ song.accompaniment_file.url }}"></audio>

    <div class="controls">
      <button id="playBtn">▶ Play Original</button>
      <button id="recordBtn">🎙 Start Recording</button>
      <button id="stopBtn" style="display:none;">⏹ Stop Recording</button>
    </div>

    <!-- Draggable & resizable camera preview container -->
    <div class="camera-container" id="cameraContainer">
      <video id="cameraPreview" playsinline autoplay muted></video>
      <div class="resize-handle" id="resizeHandle"></div>
    </div>
  </div>

  <!-- Final output overlay with three main buttons in a row -->
  <div class="final-output" id="finalOutputDiv">
    <div class="karaoke-wrapper">
      <img class="reel-bg" id="finalBg">
      <div id="finalStatus">Recording Complete!</div>
      <div class="controls" style="top: auto; bottom: 20%;">
        <div class="simple-controls">
          <button id="showPlayOptionsBtn">▶ Play</button>
          <button id="showDownloadOptionsBtn">⬇ Download</button>
          <button id="newRecordingBtn">New</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Play options -->
  <div id="playOptionsModal" class="option-modal">
    <div class="modal-content">
      <h3>▶ Play Options</h3>
      <div class="option-row">
        <button id="modalPlayMixNoFace">Mix (No Face)</button>
        <button id="modalPlayMixWithFace">Mix (With Face)</button>
      </div>
      <div class="option-row">
        <button id="modalPlayVoiceNoFace">Voice Only (No Face)</button>
        <button id="modalPlayVoiceWithFace">Voice Only (With Face)</button>
      </div>
      <button class="close-modal" id="closePlayModal">Close</button>
    </div>
  </div>

  <!-- Modal for Download options -->
  <div id="downloadOptionsModal" class="option-modal">
    <div class="modal-content">
      <h3>⬇ Download Options</h3>
      <div class="option-row">
        <a id="modalDownloadMixNoFace" href="#" download><button>Mix (No Face)</button></a>
        <a id="modalDownloadMixWithFace" href="#" download><button>Mix (With Face)</button></a>
      </div>
      <div class="option-row">
        <a id="modalDownloadVoiceNoFace" href="#" download><button>Voice Only (No Face)</button></a>
        <a id="modalDownloadVoiceWithFace" href="#" download><button>Voice Only (With Face)</button></a>
      </div>
      <button class="close-modal" id="closeDownloadModal">Close</button>
    </div>
  </div>

  <!-- Video player for playback -->
  <video id="recordingVideoPlayer" playsinline controls></video>
  <div class="video-controls" id="videoControls" style="display:none;">
    <button onclick="window.closeVideoPlayer()">Close</button>
    <button onclick="window.toggleFullscreen()">Fullscreen</button>
  </div>

  <!-- Hidden canvas & camera preview -->
  <canvas id="recordingCanvas" width="1080" height="1920"></canvas>
  <canvas id="dummyCanvas" width="1080" height="1920" style="display:none;"></canvas>
  <!-- Hidden canvas for mirroring camera (flipped horizontally) -->
  <canvas id="mirrorCanvas" style="display:none;"></canvas>

  <script>
  (function() {
    "use strict";

    /* ---------- GLOBAL STATE ---------- */
    let mediaRecorderMixNoFace, mediaRecorderMixWithFace;
    let mediaRecorderVoiceNoFace, mediaRecorderVoiceWithFace;
    let recordedChunksMixNoFace = [];
    let recordedChunksMixWithFace = [];
    let recordedChunksVoiceNoFace = [];
    let recordedChunksVoiceWithFace = [];
    let lastURLMixNoFace = null, lastURLMixWithFace = null;
    let lastURLVoiceNoFace = null, lastURLVoiceWithFace = null;
    let audioContext = null;
    let accMediaSource = null;
    let micSource = null, micGain = null, accGain = null;
    let monitorGain = null;            // for speaker output
    let mixDestination = null, voiceDestination = null;
    let canvasRafId = null;
    let dummyCanvasRafId = null;
    let isRecording = false;
    let autoStopTimer = null;
    let recordingDelayTimer = null;
    let micStream = null;
    let cameraStream = null;
    let recordingStartTime = 0;
    let recordingDuration = 0;
    let useDummy = false;

    let mirrorCanvas = null;
    let mirrorCanvasStream = null;
    let mirrorVideoTrack = null;
    let mirrorDrawingId = null;

    // Cached elements
    const playBtn = document.getElementById("playBtn");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const originalAudioEl = document.getElementById("originalAudio");
    const accompanimentEl = document.getElementById("accompaniment");
    const finalDiv = document.getElementById("finalOutputDiv");
    const mainBg = document.getElementById("mainBg");
    const finalBg = document.getElementById("finalBg");
    const finalStatus = document.getElementById("finalStatus");
    const newRecordingBtn = document.getElementById("newRecordingBtn");
    const canvasWithout = document.getElementById("recordingCanvas");
    const dummyCanvas = document.getElementById("dummyCanvas");
    const ctxWithout = canvasWithout.getContext("2d");
    const dummyCtx = dummyCanvas.getContext("2d");
    const logoImg = new Image();
    logoImg.src = document.getElementById("logoImg").src;
    const recordingVideoPlayer = document.getElementById("recordingVideoPlayer");
    const videoControls = document.getElementById("videoControls");
    const cameraContainer = document.getElementById("cameraContainer");
    const cameraPreview = document.getElementById("cameraPreview");
    const resizeHandle = document.getElementById("resizeHandle");

    const showPlayOptionsBtn = document.getElementById("showPlayOptionsBtn");
    const showDownloadOptionsBtn = document.getElementById("showDownloadOptionsBtn");

    const playModal = document.getElementById("playOptionsModal");
    const downloadModal = document.getElementById("downloadOptionsModal");
    const closePlayBtn = document.getElementById("closePlayModal");
    const closeDownloadBtn = document.getElementById("closeDownloadModal");

    const modalPlayMixNoFace = document.getElementById("modalPlayMixNoFace");
    const modalPlayMixWithFace = document.getElementById("modalPlayMixWithFace");
    const modalPlayVoiceNoFace = document.getElementById("modalPlayVoiceNoFace");
    const modalPlayVoiceWithFace = document.getElementById("modalPlayVoiceWithFace");
    const modalDownloadMixNoFace = document.getElementById("modalDownloadMixNoFace");
    const modalDownloadMixWithFace = document.getElementById("modalDownloadMixWithFace");
    const modalDownloadVoiceNoFace = document.getElementById("modalDownloadVoiceNoFace");
    const modalDownloadVoiceWithFace = document.getElementById("modalDownloadVoiceWithFace");

    // ---------- DRAG & RESIZE (unchanged) ----------
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let startLeft = 0, startTop = 0;

    function onDragStart(e) {
      if (e.target === resizeHandle) return;
      e.preventDefault();
      isDragging = true;
      const rect = cameraContainer.getBoundingClientRect();
      startLeft = rect.left;
      startTop = rect.top;
      if (e.type === 'mousedown') {
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
      } else if (e.type === 'touchstart') {
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        window.addEventListener('touchmove', onDragMove);
        window.addEventListener('touchend', onDragEnd);
        window.addEventListener('touchcancel', onDragEnd);
      }
    }
    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      let clientX, clientY;
      if (e.type === 'mousemove') { clientX = e.clientX; clientY = e.clientY; }
      else { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      const deltaX = clientX - dragStartX;
      const deltaY = clientY - dragStartY;
      let newLeft = startLeft + deltaX;
      let newTop = startTop + deltaY;
      const containerWidth = cameraContainer.offsetWidth;
      const containerHeight = cameraContainer.offsetHeight;
      const maxLeft = window.innerWidth - containerWidth;
      const maxTop = window.innerHeight - containerHeight;
      newLeft = Math.min(Math.max(0, newLeft), maxLeft);
      newTop = Math.min(Math.max(0, newTop), maxTop);
      cameraContainer.style.left = newLeft + 'px';
      cameraContainer.style.top = newTop + 'px';
    }
    function onDragEnd() {
      isDragging = false;
      window.removeEventListener('mousemove', onDragMove);
      window.removeEventListener('mouseup', onDragEnd);
      window.removeEventListener('touchmove', onDragMove);
      window.removeEventListener('touchend', onDragEnd);
      window.removeEventListener('touchcancel', onDragEnd);
    }
    cameraContainer.addEventListener('mousedown', onDragStart);
    cameraContainer.addEventListener('touchstart', onDragStart, { passive: false });

    // Resize handle
    let isResizing = false;
    let resizeStartX = 0, resizeStartY = 0;
    let startWidth = 0, startHeight = 0;
    function onResizeStart(e) {
      e.preventDefault();
      e.stopPropagation();
      isResizing = true;
      startWidth = cameraPreview.offsetWidth;
      startHeight = cameraPreview.offsetHeight;
      if (e.type === 'mousedown') {
        resizeStartX = e.clientX;
        resizeStartY = e.clientY;
        window.addEventListener('mousemove', onResizeMove);
        window.addEventListener('mouseup', onResizeEnd);
      } else if (e.type === 'touchstart') {
        resizeStartX = e.touches[0].clientX;
        resizeStartY = e.touches[0].clientY;
        window.addEventListener('touchmove', onResizeMove);
        window.addEventListener('touchend', onResizeEnd);
        window.addEventListener('touchcancel', onResizeEnd);
      }
    }
    function onResizeMove(e) {
      if (!isResizing) return;
      e.preventDefault();
      let clientX, clientY;
      if (e.type === 'mousemove') { clientX = e.clientX; clientY = e.clientY; }
      else { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      const deltaX = clientX - resizeStartX;
      const deltaY = clientY - resizeStartY;
      const delta = Math.max(deltaX, deltaY);
      let newWidth = startWidth + delta;
      const maxWidth = Math.min(300, window.innerWidth - 40);
      newWidth = Math.min(Math.max(50, newWidth), maxWidth);
      const newHeight = newWidth * (16 / 9);
      cameraPreview.style.width = newWidth + 'px';
      cameraPreview.style.height = newHeight + 'px';
    }
    function onResizeEnd() {
      isResizing = false;
      window.removeEventListener('mousemove', onResizeMove);
      window.removeEventListener('mouseup', onResizeEnd);
      window.removeEventListener('touchmove', onResizeMove);
      window.removeEventListener('touchend', onResizeEnd);
      window.removeEventListener('touchcancel', onResizeEnd);
    }
    resizeHandle.addEventListener('mousedown', onResizeStart);
    resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });

    // Pinch zoom
    let pinchStartDistance = 0;
    let pinchStartWidth = 0;
    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    function onTouchStartPinch(e) {
      if (e.touches.length === 2) {
        pinchStartDistance = getPinchDistance(e.touches);
        pinchStartWidth = cameraPreview.offsetWidth;
        e.preventDefault();
      }
    }
    function onTouchMovePinch(e) {
      if (e.touches.length === 2 && pinchStartDistance > 0) {
        const newDistance = getPinchDistance(e.touches);
        if (newDistance === 0) return;
        const scale = newDistance / pinchStartDistance;
        let newWidth = pinchStartWidth * scale;
        const maxWidth = Math.min(300, window.innerWidth - 40);
        newWidth = Math.min(Math.max(50, newWidth), maxWidth);
        const newHeight = newWidth * (16 / 9);
        cameraPreview.style.width = newWidth + 'px';
        cameraPreview.style.height = newHeight + 'px';
        e.preventDefault();
      }
    }
    function onTouchEndPinch() { pinchStartDistance = 0; }
    cameraContainer.addEventListener('touchstart', onTouchStartPinch);
    cameraContainer.addEventListener('touchmove', onTouchMovePinch);
    cameraContainer.addEventListener('touchend', onTouchEndPinch);
    cameraContainer.addEventListener('touchcancel', onTouchEndPinch);

    // ---------- HELPER: resume AudioContext ----------
    async function resumeAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000,
          latencyHint: 'playback'
        });
        accMediaSource = audioContext.createMediaElementSource(accompanimentEl);
      }
      if (audioContext.state === 'suspended') {
        try { await audioContext.resume(); } catch (e) { console.warn('resume failed', e); }
      }
      return audioContext;
    }

    // ---------- WAIT FOR VIDEO ----------
    function waitForVideo(videoElement) {
      return new Promise((resolve) => {
        if (videoElement.readyState >= 2 && videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
          resolve();
          return;
        }
        const onCanPlay = () => {
          videoElement.removeEventListener('canplay', onCanPlay);
          videoElement.removeEventListener('playing', onCanPlay);
          resolve();
        };
        videoElement.addEventListener('canplay', onCanPlay);
        videoElement.addEventListener('playing', onCanPlay);
        setTimeout(resolve, 1000);
      });
    }

    // ---------- DRAW CANVAS (background + logo) ----------
    function drawCanvas() {
      const w = canvasWithout.width;
      const h = canvasWithout.height;
      if (w === 0 || h === 0) return;

      ctxWithout.fillStyle = "#000";
      ctxWithout.fillRect(0, 0, w, h);

      // Draw background image (reel-bg) covering the top 75% of canvas
      const bgHeight = h * 0.75;
      const imgRatio = mainBg.naturalWidth / mainBg.naturalHeight;
      const canvasRatio = w / bgHeight;
      let drawW, drawH;
      if (imgRatio > canvasRatio) {
        drawW = w;
        drawH = w / imgRatio;
      } else {
        drawH = bgHeight;
        drawW = bgHeight * imgRatio;
      }
      const x = (w - drawW) / 2;
      const y = 0;
      ctxWithout.drawImage(mainBg, x, y, drawW, drawH);

      // Draw logo
      const logoSize = Math.min(80, w * 0.1);
      ctxWithout.drawImage(logoImg, 30, 30, logoSize, logoSize);

      canvasRafId = requestAnimationFrame(drawCanvas);
    }

    function drawDummyCanvas() {
      const w = dummyCanvas.width;
      const h = dummyCanvas.height;
      dummyCtx.fillStyle = "#000";
      dummyCtx.fillRect(0, 0, w, h);
      dummyCtx.fillStyle = "#333";
      dummyCtx.font = `${Math.floor(w / 15)}px Poppins`;
      dummyCtx.textAlign = "center";
      dummyCtx.fillText("Camera Unavailable", w/2, h/2);
      dummyCanvasRafId = requestAnimationFrame(drawDummyCanvas);
    }

    // ---------- CLEANUP ----------
    function cleanupRecordingNodes() {
      if (micSource) { try { micSource.disconnect(); } catch(e) {}; micSource = null; }
      if (micGain) { try { micGain.disconnect(); } catch(e) {}; micGain = null; }
      if (accGain) { try { accGain.disconnect(); } catch(e) {}; accGain = null; }
      if (monitorGain) { try { monitorGain.disconnect(); } catch(e) {}; monitorGain = null; }
      if (mixDestination) { try { mixDestination.disconnect(); } catch(e) {}; mixDestination = null; }
      if (voiceDestination) { try { voiceDestination.disconnect(); } catch(e) {}; voiceDestination = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; cameraPreview.srcObject = null; }
      if (mirrorDrawingId) { cancelAnimationFrame(mirrorDrawingId); mirrorDrawingId = null; }
      if (mirrorVideoTrack) { mirrorVideoTrack.stop(); mirrorVideoTrack = null; }
      if (mirrorCanvasStream) { mirrorCanvasStream.getTracks().forEach(t => t.stop()); mirrorCanvasStream = null; }
      accompanimentEl.pause();
      accompanimentEl.currentTime = 0;
    }

    // ---------- STOP RECORDING ----------
    function stopRecording() {
      if (recordingDelayTimer) { clearTimeout(recordingDelayTimer); recordingDelayTimer = null; }
      if (!isRecording) return;
      if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
      if (mediaRecorderMixNoFace && mediaRecorderMixNoFace.state !== 'inactive') mediaRecorderMixNoFace.stop();
      if (mediaRecorderMixWithFace && mediaRecorderMixWithFace.state !== 'inactive') mediaRecorderMixWithFace.stop();
      if (mediaRecorderVoiceNoFace && mediaRecorderVoiceNoFace.state !== 'inactive') mediaRecorderVoiceNoFace.stop();
      if (mediaRecorderVoiceWithFace && mediaRecorderVoiceWithFace.state !== 'inactive') mediaRecorderVoiceWithFace.stop();

      originalAudioEl.pause();
      originalAudioEl.currentTime = 0;
      cleanupRecordingNodes();

      if (canvasRafId) cancelAnimationFrame(canvasRafId);
      if (dummyCanvasRafId) cancelAnimationFrame(dummyCanvasRafId);
      cameraContainer.classList.remove('visible');
      cameraPreview.pause();

      isRecording = false;
      statusEl.innerText = "Processing recording...";
    }

    let recordersStopped = 0;
    function onRecorderStop() {
      recordersStopped++;
      if (recordersStopped === 4) {
        recordingDuration = (Date.now() - recordingStartTime) / 1000;
        finalBg.src = mainBg.src;
        finalDiv.style.display = "flex";
        const mins = Math.floor(recordingDuration / 60);
        const secs = Math.floor(recordingDuration % 60);
        finalStatus.innerText = `✅ Complete (${mins}:${secs.toString().padStart(2,'0')})`;

        // Attach blobs to download links & play buttons
        if (recordedChunksMixNoFace.length) {
          const blob = new Blob(recordedChunksMixNoFace, { type: mediaRecorderMixNoFace.mimeType });
          const url = URL.createObjectURL(blob);
          if (lastURLMixNoFace) URL.revokeObjectURL(lastURLMixNoFace);
          lastURLMixNoFace = url;
          let songName = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_');
          let ext = mediaRecorderMixNoFace.mimeType.includes('mp4') ? '_KARAOKE.mp4' : '_KARAOKE.webm';
          modalDownloadMixNoFace.href = url;
          modalDownloadMixNoFace.download = songName + '_mix_noface' + ext;
          modalPlayMixNoFace.onclick = () => playVideo(url);
        }
        if (recordedChunksMixWithFace.length) {
          const blob = new Blob(recordedChunksMixWithFace, { type: mediaRecorderMixWithFace.mimeType });
          const url = URL.createObjectURL(blob);
          if (lastURLMixWithFace) URL.revokeObjectURL(lastURLMixWithFace);
          lastURLMixWithFace = url;
          let songName = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_');
          let ext = mediaRecorderMixWithFace.mimeType.includes('mp4') ? '_KARAOKE.mp4' : '_KARAOKE.webm';
          modalDownloadMixWithFace.href = url;
          modalDownloadMixWithFace.download = songName + '_mix_withface' + ext;
          modalPlayMixWithFace.onclick = () => playVideo(url);
        }
        if (recordedChunksVoiceNoFace.length) {
          const blob = new Blob(recordedChunksVoiceNoFace, { type: mediaRecorderVoiceNoFace.mimeType });
          const url = URL.createObjectURL(blob);
          if (lastURLVoiceNoFace) URL.revokeObjectURL(lastURLVoiceNoFace);
          lastURLVoiceNoFace = url;
          let songName = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_');
          let ext = mediaRecorderVoiceNoFace.mimeType.includes('mp4') ? '_KARAOKE.mp4' : '_KARAOKE.webm';
          modalDownloadVoiceNoFace.href = url;
          modalDownloadVoiceNoFace.download = songName + '_voice_noface' + ext;
          modalPlayVoiceNoFace.onclick = () => playVideo(url);
        }
        if (recordedChunksVoiceWithFace.length) {
          const blob = new Blob(recordedChunksVoiceWithFace, { type: mediaRecorderVoiceWithFace.mimeType });
          const url = URL.createObjectURL(blob);
          if (lastURLVoiceWithFace) URL.revokeObjectURL(lastURLVoiceWithFace);
          lastURLVoiceWithFace = url;
          let songName = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_');
          let ext = mediaRecorderVoiceWithFace.mimeType.includes('mp4') ? '_KARAOKE.mp4' : '_KARAOKE.webm';
          modalDownloadVoiceWithFace.href = url;
          modalDownloadVoiceWithFace.download = songName + '_voice_withface' + ext;
          modalPlayVoiceWithFace.onclick = () => playVideo(url);
        }

        playBtn.style.display = "inline-block";
        recordBtn.style.display = "inline-block";
        stopBtn.style.display = "none";
        statusEl.innerText = "Ready 🎤";
        recordersStopped = 0;
      }
    }

    function playVideo(url) {
      if (!recordingVideoPlayer.paused) recordingVideoPlayer.pause();
      recordingVideoPlayer.src = url;
      recordingVideoPlayer.style.display = 'block';
      videoControls.style.display = 'flex';
      finalDiv.style.display = 'none';
      playModal.style.display = 'none';
      downloadModal.style.display = 'none';
      recordingVideoPlayer.play();
    }

    // ---------- PLAY ORIGINAL ----------
    playBtn.onclick = async function() {
      if (isRecording) return;
      if (!originalAudioEl.paused) {
        originalAudioEl.pause();
        originalAudioEl.currentTime = 0;
        playBtn.innerText = "▶ Play Original";
        statusEl.innerText = "⏹ Stopped";
      } else {
        try {
          await resumeAudioContext();   // ensure context active
          await originalAudioEl.play();
          playBtn.innerText = "⏹ Stop Original";
          statusEl.innerText = "🎵 Playing original...";
        } catch (e) {
          statusEl.innerText = "❌ play failed";
        }
      }
    };

    // ---------- MODAL HANDLERS ----------
    showPlayOptionsBtn.onclick = () => { playModal.style.display = 'flex'; };
    showDownloadOptionsBtn.onclick = () => { downloadModal.style.display = 'flex'; };
    closePlayBtn.onclick = () => { playModal.style.display = 'none'; };
    closeDownloadBtn.onclick = () => { downloadModal.style.display = 'none'; };
    playModal.onclick = (e) => { if (e.target === playModal) playModal.style.display = 'none'; };
    downloadModal.onclick = (e) => { if (e.target === downloadModal) downloadModal.style.display = 'none'; };

    // ---------- MIRROR CANVAS SETUP (flips video horizontally) ----------
    function setupMirroredCameraTrack(videoElement, targetWidth, targetHeight) {
      return new Promise((resolve) => {
        if (!mirrorCanvas) {
          mirrorCanvas = document.getElementById('mirrorCanvas');
          if (!mirrorCanvas) {
            mirrorCanvas = document.createElement('canvas');
            mirrorCanvas.id = 'mirrorCanvas';
            mirrorCanvas.style.display = 'none';
            document.body.appendChild(mirrorCanvas);
          }
        }
        mirrorCanvas.width = targetWidth;
        mirrorCanvas.height = targetHeight;
        const ctx = mirrorCanvas.getContext('2d');
        function drawMirror() {
          if (!videoElement || videoElement.paused || videoElement.ended) {
            mirrorDrawingId = requestAnimationFrame(drawMirror);
            return;
          }
          ctx.clearRect(0, 0, targetWidth, targetHeight);
          ctx.save();
          ctx.scale(-1, 1);
          ctx.drawImage(videoElement, -targetWidth, 0, targetWidth, targetHeight);
          ctx.restore();
          mirrorDrawingId = requestAnimationFrame(drawMirror);
        }
        if (mirrorDrawingId) cancelAnimationFrame(mirrorDrawingId);
        drawMirror();
        const stream = mirrorCanvas.captureStream(30);
        const track = stream.getVideoTracks()[0];
        resolve({ stream, track });
      });
    }

    // ---------- RECORD BUTTON – fixed mobile playback & camera ----------
    recordBtn.onclick = async function() {
      if (isRecording) return;
      if (!originalAudioEl.paused) {
        originalAudioEl.pause();
        originalAudioEl.currentTime = 0;
        playBtn.innerText = "▶ Play Original";
      }

      playBtn.style.display = "none";
      recordBtn.style.display = "none";
      stopBtn.style.display = "inline-block";
      statusEl.innerText = "🎙 Starting (mic & camera) ...";

      try {
        await resumeAudioContext();

        // Microphone
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: false, channelCount: 1, sampleRate: 48000 },
          video: false
        });

        // Camera – try real stream
        useDummy = false;
        let cameraReady = false;
        let targetWidth = 720, targetHeight = 1280;
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1920 } },
            audio: false
          });
          cameraPreview.srcObject = cameraStream;
          await cameraPreview.play();
          await waitForVideo(cameraPreview);
          let camW = cameraPreview.videoWidth;
          let camH = cameraPreview.videoHeight;
          if (camW > camH) { targetWidth = Math.min(camH, 1080); targetHeight = Math.min(camW, 1920); }
          else { targetWidth = Math.min(camW, 1080); targetHeight = Math.min(camH, 1920); }
          cameraContainer.classList.add('visible');
          cameraReady = true;
        } catch (camErr) {
          console.error('Camera not available, using dummy canvas:', camErr);
          cameraStream = null;
          useDummy = true;
          targetWidth = 720;
          targetHeight = 1280;
          dummyCanvas.width = targetWidth;
          dummyCanvas.height = targetHeight;
          drawDummyCanvas();
          cameraContainer.classList.remove('visible');
        }

        canvasWithout.width = targetWidth;
        canvasWithout.height = targetHeight;
        drawCanvas();

        // Short countdown only if camera is real
        if (cameraReady) {
          for (let i = 3; i > 0; i--) {
            statusEl.innerText = `🎥 Recording starts in ${i}...`;
            await new Promise(r => setTimeout(r, 1000));
          }
        }

        // Build audio graph with monitoring to speakers
        micSource = audioContext.createMediaStreamSource(micStream);
        micGain = audioContext.createGain();
        micGain.gain.value = 1.5;      // vocal volume for mix
        accGain = audioContext.createGain();
        accGain.gain.value = 0.15;     // accompaniment volume for mix (lower)
        monitorGain = audioContext.createGain();
        monitorGain.gain.value = 0.8;   // monitoring volume to speakers

        mixDestination = audioContext.createMediaStreamDestination();
        voiceDestination = audioContext.createMediaStreamDestination();

        // Connections for recording
        micSource.connect(micGain);
        micGain.connect(mixDestination);
        micGain.connect(voiceDestination);
        accMediaSource.connect(accGain);
        accGain.connect(mixDestination);

        // Monitoring connections (so user hears themselves + accompaniment)
        micGain.connect(monitorGain);
        accGain.connect(monitorGain);
        monitorGain.connect(audioContext.destination);

        // Play accompaniment and original (original is not in graph, just for reference)
        await Promise.all([
          accompanimentEl.play(),
          originalAudioEl.play()
        ]).catch(e => console.warn('playback start issue:', e));

        const audioTrackMix = mixDestination.stream.getAudioTracks()[0];
        const audioTrackVoice = voiceDestination.stream.getAudioTracks()[0];

        // Video tracks
        const videoTrackCanvas = canvasWithout.captureStream(30).getVideoTracks()[0];
        let videoTrackWithFace;
        if (cameraReady) {
          const { track } = await setupMirroredCameraTrack(cameraPreview, targetWidth, targetHeight);
          videoTrackWithFace = track;
        } else {
          videoTrackWithFace = dummyCanvas.captureStream(30).getVideoTracks()[0];
        }

        const streamMixNoFace = new MediaStream([videoTrackCanvas, audioTrackMix.clone()]);
        const streamMixWithFace = new MediaStream([videoTrackWithFace, audioTrackMix.clone()]);
        const streamVoiceNoFace = new MediaStream([videoTrackCanvas, audioTrackVoice.clone()]);
        const streamVoiceWithFace = new MediaStream([videoTrackWithFace, audioTrackVoice.clone()]);

        let mimeType = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4;codecs=avc1.4D401E,mp4a.40.2';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

        recordedChunksMixNoFace = [];
        recordedChunksMixWithFace = [];
        recordedChunksVoiceNoFace = [];
        recordedChunksVoiceWithFace = [];
        recordersStopped = 0;

        mediaRecorderMixNoFace = new MediaRecorder(streamMixNoFace, { mimeType, audioBitsPerSecond: 256000, videoBitsPerSecond: 12000000 });
        mediaRecorderMixWithFace = new MediaRecorder(streamMixWithFace, { mimeType, audioBitsPerSecond: 256000, videoBitsPerSecond: 12000000 });
        mediaRecorderVoiceNoFace = new MediaRecorder(streamVoiceNoFace, { mimeType, audioBitsPerSecond: 256000, videoBitsPerSecond: 12000000 });
        mediaRecorderVoiceWithFace = new MediaRecorder(streamVoiceWithFace, { mimeType, audioBitsPerSecond: 256000, videoBitsPerSecond: 12000000 });

        mediaRecorderMixNoFace.ondataavailable = e => { if (e.data.size > 0) recordedChunksMixNoFace.push(e.data); };
        mediaRecorderMixWithFace.ondataavailable = e => { if (e.data.size > 0) recordedChunksMixWithFace.push(e.data); };
        mediaRecorderVoiceNoFace.ondataavailable = e => { if (e.data.size > 0) recordedChunksVoiceNoFace.push(e.data); };
        mediaRecorderVoiceWithFace.ondataavailable = e => { if (e.data.size > 0) recordedChunksVoiceWithFace.push(e.data); };

        mediaRecorderMixNoFace.onstop = onRecorderStop;
        mediaRecorderMixWithFace.onstop = onRecorderStop;
        mediaRecorderVoiceNoFace.onstop = onRecorderStop;
        mediaRecorderVoiceWithFace.onstop = onRecorderStop;

        recordingStartTime = Date.now();

        mediaRecorderMixNoFace.start(1000);
        mediaRecorderMixWithFace.start(1000);
        mediaRecorderVoiceNoFace.start(1000);
        mediaRecorderVoiceWithFace.start(1000);

        isRecording = true;
        statusEl.innerText = "🎙 Recording...";

        let durationSec = accompanimentEl.duration;
        if (!isFinite(durationSec) || durationSec <= 0) durationSec = 300;
        const durationMs = (durationSec * 1000) + 500;
        autoStopTimer = setTimeout(() => {
          if (isRecording) {
            stopRecording();
            statusEl.innerText = "⏹ Auto-stopped";
          }
        }, durationMs);

      } catch (err) {
        console.error("Recording error:", err);
        statusEl.innerText = "❌ " + (err.message || "mic error");
        playBtn.style.display = "inline-block";
        recordBtn.style.display = "inline-block";
        stopBtn.style.display = "none";
        isRecording = false;
        cleanupRecordingNodes();
        if (dummyCanvasRafId) cancelAnimationFrame(dummyCanvasRafId);
        cameraContainer.classList.remove('visible');
      }
    };

    stopBtn.onclick = function() {
      stopRecording();
      statusEl.innerText = "⏹ Stopped recording";
    };

    newRecordingBtn.onclick = function() {
      window.closeVideoPlayer();
      finalDiv.style.display = "none";
      if (!originalAudioEl.paused) {
        originalAudioEl.pause();
        originalAudioEl.currentTime = 0;
      }
      accompanimentEl.pause();
      accompanimentEl.currentTime = 0;
      playBtn.style.display = "inline-block";
      playBtn.innerText = "▶ Play Original";
      recordBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
      statusEl.innerText = "Ready 🎤";

      recordedChunksMixNoFace = [];
      recordedChunksMixWithFace = [];
      recordedChunksVoiceNoFace = [];
      recordedChunksVoiceWithFace = [];
      isRecording = false;

      if (lastURLMixNoFace) { URL.revokeObjectURL(lastURLMixNoFace); lastURLMixNoFace = null; }
      if (lastURLMixWithFace) { URL.revokeObjectURL(lastURLMixWithFace); lastURLMixWithFace = null; }
      if (lastURLVoiceNoFace) { URL.revokeObjectURL(lastURLVoiceNoFace); lastURLVoiceNoFace = null; }
      if (lastURLVoiceWithFace) { URL.revokeObjectURL(lastURLVoiceWithFace); lastURLVoiceWithFace = null; }

      cameraContainer.classList.remove('visible');
      resumeAudioContext();
    };

    // ---------- VIDEO PLAYER controls ----------
    window.closeVideoPlayer = function() {
      if (recordingVideoPlayer) {
        recordingVideoPlayer.pause();
        recordingVideoPlayer.currentTime = 0;
        recordingVideoPlayer.style.display = 'none';
        videoControls.style.display = 'none';
        recordingVideoPlayer.src = '';
      }
      finalDiv.style.display = 'flex';
      if (document.fullscreenElement) document.exitFullscreen();
    };
    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) recordingVideoPlayer.requestFullscreen().catch(e => console.log(e));
      else document.exitFullscreen();
    };
    recordingVideoPlayer.addEventListener('click', function() {
      if (this.paused) this.play(); else this.pause();
    });

    // ---------- INIT ----------
    window.addEventListener('load', async () => {
      await resumeAudioContext();
      statusEl.innerText = "Ready 🎤 — tap buttons";
    });
    document.addEventListener('touchstart', async () => { await resumeAudioContext(); }, { once: true });
    window.addEventListener('beforeunload', () => {
      if (lastURLMixNoFace) URL.revokeObjectURL(lastURLMixNoFace);
      if (lastURLMixWithFace) URL.revokeObjectURL(lastURLMixWithFace);
      if (lastURLVoiceNoFace) URL.revokeObjectURL(lastURLVoiceNoFace);
      if (lastURLVoiceWithFace) URL.revokeObjectURL(lastURLVoiceWithFace);
      if (audioContext) audioContext.close();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      if (mirrorVideoTrack) mirrorVideoTrack.stop();
    });
    window.addEventListener('pagehide', () => {
      if (canvasRafId) cancelAnimationFrame(canvasRafId);
      if (dummyCanvasRafId) cancelAnimationFrame(dummyCanvasRafId);
      if (mirrorDrawingId) cancelAnimationFrame(mirrorDrawingId);
    });
  })();
  </script>
</body>
</html>

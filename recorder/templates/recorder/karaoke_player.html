<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎤 Sing Along </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    /* === EXACT same styles – untouched, only readability tweaks === */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      overflow: hidden !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      touch-action: manipulation;
    }
    body { 
      background: #000; 
      font-family: 'Poppins', sans-serif; 
      height: 100% !important;
      width: 100% !important;
      overflow: hidden !important;
      position: fixed !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .karaoke-wrapper {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background: #111 !important;
      overflow: hidden !important;
      aspect-ratio: 9 / 16 !important;
    }
    #status { 
      position: absolute; 
      top: 10px; 
      width: 100%; 
      text-align: center; 
      font-size: 12px; 
      color: #ccc; 
      z-index: 20; 
      text-shadow: 1px 1px 6px rgba(0,0,0,0.9); 
      padding: 5px;
    }
    .reel-bg { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important; 
      height: 75% !important;          /* image occupies 75% of screen */
      object-fit: contain !important;
      object-position: center !important;
    }
    .controls { 
      position: absolute; 
      top: 76% !important;              /* 75% image + 1% gap */
      left: 0;
      width: 100%;
      text-align: center; 
      z-index: 30; 
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 10px;
      box-sizing: border-box;
    }
    button { 
      background: linear-gradient(135deg, #ff0066, #ff66cc); 
      border: none; 
      color: white; 
      padding: 10px 15px; 
      border-radius: 20px; 
      font-size: 12px; 
      margin: 2px; 
      box-shadow: 0px 3px 15px rgba(255,0,128,0.4); 
      cursor: pointer; 
      min-width: 100px;
      flex: 1;
      max-width: 150px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      transition: transform 0.05s ease;  /* tiny feedback without lag */
    }
    button:active { 
      transform: scale(0.95); 
      opacity: 0.9;
    }
    #logoImg { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      width: 30px;
      height: 30px;
      z-index: 50; 
      opacity: 1;
      filter: brightness(1.2);
    }
    .final-output { 
      position: absolute !important; 
      width: 100% !important; 
      height: 100% !important; 
      top: 0 !important; 
      left: 0 !important; 
      background: rgba(0,0,0,0.95); 
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .audio-player {
      display: none;
    }
    #recordingVideoPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 1000;
    }
    .video-controls {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      z-index: 1001;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .video-controls button {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
    }
    canvas { 
      display: none; 
    }
  </style>
</head>
<body>
  <div class="karaoke-wrapper" id="karaokeWrapper">
    <!-- Background image (Django template) -->
    {% if song.lyrics_image %}
    <img class="reel-bg" id="mainBg" src="{{ song.lyrics_image.url }}">
    {% else %}
    <img class="reel-bg" id="mainBg" src="/static/default_lyrics_bg.jpg">
    {% endif %}

    <!-- Logo -->
    <img id="logoImg" src="/media/logo/branks3_logo.png" onerror="this.style.display='none'">

    <!-- Status text -->
    <div id="status">Ready 🎤 Tap any button</div>

    <!-- Hidden audio elements (preload helps responsiveness) -->
    <audio id="originalAudio" class="audio-player" preload="auto" src="{{ song.original_file.url }}"></audio>
    <audio id="accompaniment" class="audio-player" preload="auto" src="{{ song.accompaniment_file.url }}"></audio>

    <!-- Controls (same layout) -->
    <div class="controls">
      <button id="playBtn">▶ Play Original</button>
      <button id="recordBtn">🎙 Start Recording</button>
      <button id="stopBtn" style="display:none;">⏹ Stop Recording</button>
    </div>
  </div>

  <!-- Final output overlay (after recording) -->
  <div class="final-output" id="finalOutputDiv">
    <div class="karaoke-wrapper">
      <img class="reel-bg" id="finalBg">
      <div id="finalStatus">Recording Complete!</div>
      <div class="controls">
        <button id="playRecordingBtn">▶ Play</button>
        <a id="downloadRecordingBtn" href="#" download>
          <button>⬇ Download</button>
        </a>
        <button id="newRecordingBtn">New</button>
      </div>
    </div>
  </div>

  <!-- Video player for playback -->
  <video id="recordingVideoPlayer" playsinline controls></video>
  <div class="video-controls" id="videoControls" style="display:none;">
    <button onclick="window.closeVideoPlayer()">Close</button>
    <button onclick="window.toggleFullscreen()">Fullscreen</button>
  </div>

  <!-- Hidden canvas for recording (720x1280) -->
  <canvas id="recordingCanvas" width="720" height="1280"></canvas>

  <script>
  (function() {
    "use strict";

    /* ---------- GLOBAL STATE ---------- */
    let mediaRecorder;
    let recordedChunks = [];
    let lastRecordingURL = null;
    let audioContext = null;
    let micSource = null, accSource = null, micGain = null, accGain = null, destination = null;
    let originalSource = null;                // for Web Audio playback (Play Original)
    let canvasRafId = null;
    let isRecording = false;
    let isPlayingRecording = false;
    let isSongPlaying = false;                 // original via Web Audio
    let autoStopTimer = null;
    let micStream = null;
    let recordingStartTime = 0;
    let recordingDuration = 0;
    let originalAudioBuffer = null;
    let accompanimentBuffer = null;

    /* ---------- ELEMENTS (cached) ---------- */
    const playBtn = document.getElementById("playBtn");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const originalAudioEl = document.getElementById("originalAudio");
    const accompanimentEl = document.getElementById("accompaniment");
    const finalDiv = document.getElementById("finalOutputDiv");
    const mainBg = document.getElementById("mainBg");
    const finalBg = document.getElementById("finalBg");
    const finalStatus = document.getElementById("finalStatus");
    const playRecordingBtn = document.getElementById("playRecordingBtn");
    const downloadRecordingBtn = document.getElementById("downloadRecordingBtn");
    const newRecordingBtn = document.getElementById("newRecordingBtn");
    const canvas = document.getElementById("recordingCanvas");
    const ctx = canvas.getContext("2d");
    const logoImg = new Image();
    logoImg.src = document.getElementById("logoImg").src;
    const recordingVideoPlayer = document.getElementById("recordingVideoPlayer");
    const videoControls = document.getElementById("videoControls");

    /* ---------- HELPER: resume AudioContext ---------- */
    async function resumeAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000,
          latencyHint: 'playback'
        });
      }
      if (audioContext.state === 'suspended') {
        try { await audioContext.resume(); } catch (e) { console.warn('resume failed', e); }
      }
      return audioContext;
    }

    /* ---------- LOAD BUFFERS ---------- */
    async function loadAudioBuffers() {
      const ctx = await resumeAudioContext();
      try {
        const origResp = await fetch(originalAudioEl.src);
        const origArray = await origResp.arrayBuffer();
        originalAudioBuffer = await ctx.decodeAudioData(origArray);
        const accResp = await fetch(accompanimentEl.src);
        const accArray = await accResp.arrayBuffer();
        accompanimentBuffer = await ctx.decodeAudioData(accArray);
        console.log('Buffers loaded');
      } catch (e) {
        console.warn('Buffer loading failed, will retry on demand', e);
      }
    }

    /* ---------- DRAW CANVAS ---------- */
    function drawCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const canvasW = canvas.width;
      const canvasH = canvas.height * 0.75;

      const imgRatio = mainBg.naturalWidth / mainBg.naturalHeight;
      const canvasRatio = canvasW / canvasH;

      let drawW, drawH;
      if (imgRatio > canvasRatio) {
        drawW = canvasW;
        drawH = canvasW / imgRatio;
      } else {
        drawH = canvasH;
        drawW = canvasH * imgRatio;
      }

      const x = (canvasW - drawW) / 2;
      const y = 0;

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(mainBg, x, y, drawW, drawH);

      const logoSize = 60;
      ctx.drawImage(logoImg, 20, 20, logoSize, logoSize);

      canvasRafId = requestAnimationFrame(drawCanvas);
    }

    /* ---------- CLEANUP ---------- */
    function cleanupAudioSources() {
      if (accSource) {
        try { accSource.stop(); accSource.disconnect(); } catch (e) {}
        accSource = null;
      }
      if (originalSource) {
        try { originalSource.stop(); originalSource.disconnect(); } catch (e) {}
        originalSource = null;
      }
      if (micSource) {
        try { micSource.disconnect(); } catch (e) {}
        micSource = null;
      }
      if (micGain) {
        try { micGain.disconnect(); } catch (e) {}
        micGain = null;
      }
      if (accGain) {
        try { accGain.disconnect(); } catch (e) {}
        accGain = null;
      }
      if (destination) {
        try { destination.disconnect(); } catch (e) {}
        destination = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
    }

    /* ---------- STOP RECORDING ---------- */
    function stopRecording() {
      if (!isRecording) return;
      if (autoStopTimer) {
        clearTimeout(autoStopTimer);
        autoStopTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      originalAudioEl.pause();
      originalAudioEl.currentTime = 0;

      cleanupAudioSources();

      if (canvasRafId) {
        cancelAnimationFrame(canvasRafId);
        canvasRafId = null;
      }
      isRecording = false;

      stopBtn.style.display = "none";
      statusEl.innerText = "Processing recording...";
    }

    /* ---------- RESET UI AFTER ERROR ---------- */
    function resetUIAfterError() {
      isRecording = false;
      isSongPlaying = false;
      playBtn.style.display = "inline-block";
      playBtn.innerText = "▶ Play Original";
      recordBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
      if (autoStopTimer) {
        clearTimeout(autoStopTimer);
        autoStopTimer = null;
      }
      cleanupAudioSources();
      if (originalSource) {
        try { originalSource.stop(); } catch(e) {}
        originalSource = null;
      }
      originalAudioEl.pause();
      originalAudioEl.currentTime = 0;
      statusEl.innerText = "Ready 🎤";
    }

    /* ---------- PLAY ORIGINAL (Web Audio) ---------- */
    playBtn.onclick = async function() {
      await resumeAudioContext();
      if (!originalAudioBuffer || !accompanimentBuffer) {
        await loadAudioBuffers();
      }
      if (!isSongPlaying) {
        if (isRecording) stopRecording();

        if (originalSource) {
          originalSource.stop();
          originalSource.disconnect();
          originalSource = null;
        }

        originalSource = audioContext.createBufferSource();
        originalSource.buffer = originalAudioBuffer;
        originalSource.connect(audioContext.destination);
        originalSource.start();
        isSongPlaying = true;
        playBtn.innerText = "⏹ Stop Original";
        statusEl.innerText = "🎵 Playing original...";

        originalSource.onended = () => {
          isSongPlaying = false;
          playBtn.innerText = "▶ Play Original";
          statusEl.innerText = "✅ Song finished";
          originalSource = null;
        };
      } else {
        if (originalSource) {
          originalSource.stop();
          originalSource.disconnect();
          originalSource = null;
        }
        isSongPlaying = false;
        playBtn.innerText = "▶ Play Original";
        statusEl.innerText = "⏹ Stopped";
      }
    };

    /* ---------- RECORD BUTTON ---------- */
    recordBtn.onclick = async function() {
      if (isRecording) return;

      await resumeAudioContext();

      // Stop any playing original (Web Audio)
      if (isSongPlaying && originalSource) {
        originalSource.stop();
        originalSource.disconnect();
        originalSource = null;
        isSongPlaying = false;
        playBtn.innerText = "▶ Play Original";
      }

      playBtn.style.display = "none";
      recordBtn.style.display = "none";
      stopBtn.style.display = "inline-block";
      statusEl.innerText = "🎙 Requesting mic & starting...";

      try {
        if (!originalAudioBuffer || !accompanimentBuffer) {
          await loadAudioBuffers();
        }

        // ===== PLAY THE ORIGINAL SONG FOR THE SINGER (not recorded) =====
        originalAudioEl.currentTime = 0;
        await originalAudioEl.play();   // singer hears the guide track

        // Microphone
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: true,
            autoGainControl: false,
            channelCount: 1,
            sampleRate: 48000
          },
          video: false
        });

        // Build graph for recorded audio: mic + accompaniment
        micSource = audioContext.createMediaStreamSource(micStream);

        accSource = audioContext.createBufferSource();
        accSource.buffer = accompanimentBuffer;

        micGain = audioContext.createGain();
        micGain.gain.value = 1.5;   // voice volume
        accGain = audioContext.createGain();
        accGain.gain.value = 0.7;   // accompaniment volume

        destination = audioContext.createMediaStreamDestination();

        micSource.connect(micGain);
        micGain.connect(destination);
        accSource.connect(accGain);
        accGain.connect(destination);

        drawCanvas();
        accSource.start();   // accompaniment starts (will be recorded)

        const canvasStream = canvas.captureStream(30);
        const audioStream = destination.stream;
        const combinedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioStream.getAudioTracks()
        ]);

        // MIME type selection
        let mimeType = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp9,opus';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp8,opus';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm';
        }

        mediaRecorder = new MediaRecorder(combinedStream, {
          mimeType: mimeType,
          audioBitsPerSecond: 256000,
          videoBitsPerSecond: 5000000
        });

        recordedChunks = [];
        recordingStartTime = Date.now();

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          if (canvasRafId) {
            cancelAnimationFrame(canvasRafId);
            canvasRafId = null;
          }

          recordingDuration = (Date.now() - recordingStartTime) / 1000;

          // Stop the guide track
          originalAudioEl.pause();
          originalAudioEl.currentTime = 0;

          cleanupAudioSources();

          if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
            lastRecordingURL = url;

            finalBg.src = mainBg.src;
            finalDiv.style.display = "flex";

            const mins = Math.floor(recordingDuration / 60);
            const secs = Math.floor(recordingDuration % 60);
            finalStatus.innerText = `✅ Complete (${mins}:${secs.toString().padStart(2,'0')})`;

            let songName = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_');
            let ext = mimeType.includes('mp4') ? '_KARAOKE.mp4' : '_KARAOKE.webm';
            downloadRecordingBtn.href = url;
            downloadRecordingBtn.download = songName + ext;

            playRecordingBtn.onclick = () => {
              if (!isPlayingRecording) {
                recordingVideoPlayer.src = url;
                recordingVideoPlayer.style.display = 'block';
                videoControls.style.display = 'flex';
                finalDiv.style.display = 'none';
                recordingVideoPlayer.play();
                playRecordingBtn.innerText = "⏹ Stop";
                isPlayingRecording = true;

                recordingVideoPlayer.onended = () => {
                  closeVideoPlayer();
                  playRecordingBtn.innerText = "▶ Play";
                  isPlayingRecording = false;
                };
              } else {
                closeVideoPlayer();
                playRecordingBtn.innerText = "▶ Play";
                isPlayingRecording = false;
              }
            };
          }

          playBtn.style.display = "inline-block";
          recordBtn.style.display = "inline-block";
          stopBtn.style.display = "none";
          statusEl.innerText = "Ready 🎤";
          isRecording = false;
        };

        mediaRecorder.start(1000);
        isRecording = true;
        statusEl.innerText = "🎙 Recording...";

        const durationMs = (accompanimentBuffer.duration * 1000) + 500;
        autoStopTimer = setTimeout(() => {
          if (isRecording) {
            stopRecording();
            statusEl.innerText = "⏹ Auto-stopped";
          }
        }, durationMs);

      } catch (err) {
        console.error("Recording error:", err);
        statusEl.innerText = "❌ " + (err.message || "mic error");
        resetUIAfterError();
      }
    };

    /* ---------- STOP button ---------- */
    stopBtn.onclick = function() {
      stopRecording();
      statusEl.innerText = "⏹ Stopped recording";
    };

    /* ---------- NEW RECORDING button ---------- */
    newRecordingBtn.onclick = function() {
      closeVideoPlayer();
      finalDiv.style.display = "none";

      if (isSongPlaying && originalSource) {
        originalSource.stop();
        originalSource.disconnect();
        originalSource = null;
        isSongPlaying = false;
      }
      originalAudioEl.pause();
      originalAudioEl.currentTime = 0;

      playBtn.style.display = "inline-block";
      playBtn.innerText = "▶ Play Original";
      recordBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
      statusEl.innerText = "Ready 🎤";

      recordedChunks = [];
      isRecording = false;
      isPlayingRecording = false;

      if (lastRecordingURL) {
        URL.revokeObjectURL(lastRecordingURL);
        lastRecordingURL = null;
      }

      resumeAudioContext();
    };

    /* ---------- VIDEO PLAYER controls ---------- */
    window.closeVideoPlayer = function() {
      if (recordingVideoPlayer) {
        recordingVideoPlayer.pause();
        recordingVideoPlayer.currentTime = 0;
        recordingVideoPlayer.style.display = 'none';
        videoControls.style.display = 'none';
        recordingVideoPlayer.src = '';
      }
      finalDiv.style.display = 'flex';
      playRecordingBtn.innerText = "▶ Play";
      isPlayingRecording = false;
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    };

    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        recordingVideoPlayer.requestFullscreen().catch(e => console.log(e));
      } else {
        document.exitFullscreen();
      }
    };

    recordingVideoPlayer.addEventListener('click', function() {
      if (this.paused) this.play(); else this.pause();
    });

    /* ---------- INIT ---------- */
    window.addEventListener('load', async () => {
      await resumeAudioContext();
      loadAudioBuffers().then(() => {
        statusEl.innerText = "Ready 🎤 – tap buttons";
      }).catch(() => {
        statusEl.innerText = "Ready 🎤";
      });
    });

    document.addEventListener('touchstart', async () => {
      await resumeAudioContext();
    }, { once: true });

    window.addEventListener('beforeunload', () => {
      if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
      if (audioContext) audioContext.close();
      cleanupAudioSources();
    });

    window.addEventListener('pagehide', () => {
      if (canvasRafId) cancelAnimationFrame(canvasRafId);
    });

  })();
  </script>
</body>
</html>

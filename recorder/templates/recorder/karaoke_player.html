<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎤 Sing Along </title>
  <link rel="icon" type="image/png" href="/media/logo/branks3_logo.png">
  <!-- logo image is placed inside body, not here -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    /* === EXACT same styles – completely untouched, only readability === */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      overflow: hidden !important;
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      touch-action: manipulation;
    }
    body { 
      background: #000; 
      font-family: 'Poppins', sans-serif; 
      height: 100% !important;
      width: 100% !important;
      overflow: hidden !important;
      position: fixed !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .karaoke-wrapper {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background: #111 !important;
      overflow: hidden !important;
      aspect-ratio: 9 / 16 !important;
    }
    #status { 
      position: absolute; 
      top: 10px; 
      width: 100%; 
      text-align: center; 
      font-size: 12px; 
      color: #ccc; 
      z-index: 20; 
      text-shadow: 1px 1px 6px rgba(0,0,0,0.9); 
      padding: 5px;
    }
    .reel-bg { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important; 
      height: 75% !important;          /* image occupies 75% of screen */
      object-fit: contain !important;
      object-position: center !important;
    }
    .controls { 
      position: absolute; 
      top: 76% !important;              /* 75% image + 1% gap */
      left: 0;
      width: 100%;
      text-align: center; 
      z-index: 30; 
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 10px;
      box-sizing: border-box;
    }
    button { 
      background: linear-gradient(135deg, #ff0066, #ff66cc); 
      border: none; 
      color: white; 
      padding: 10px 15px; 
      border-radius: 20px; 
      font-size: 12px; 
      margin: 2px; 
      box-shadow: 0px 3px 15px rgba(255,0,128,0.4); 
      cursor: pointer; 
      min-width: 100px;
      flex: 1;
      max-width: 150px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      transition: transform 0.05s ease;
    }
    button:active { 
      transform: scale(0.95); 
      opacity: 0.9;
    }
    #logoImg { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      width: 30px;
      height: 30px;
      z-index: 50; 
      opacity: 1;
      filter: brightness(1.2);
    }
    .final-output { 
      position: absolute !important; 
      width: 100% !important; 
      height: 100% !important; 
      top: 0 !important; 
      left: 0 !important; 
      background: rgba(0,0,0,0.95); 
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .audio-player {
      display: none;
    }
    #recordingVideoPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 1000;
    }
    .video-controls {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      z-index: 1001;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .video-controls button {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
    }
    canvas { 
      display: none; 
    }
  </style>
</head>
<body>
  <div class="karaoke-wrapper" id="karaokeWrapper">
    <!-- Background image (Django template) -->
    {% if song.lyrics_image %}
    <img class="reel-bg" id="mainBg" src="{{ song.lyrics_image.url }}">
    {% else %}
    <img class="reel-bg" id="mainBg" src="/static/default_lyrics_bg.jpg">
    {% endif %}

    <!-- Logo -->
    <img id="logoImg" src="/media/logo/branks3_logo.png" onerror="this.style.display='none'">

    <!-- Status text -->
    <div id="status">Ready 🎤</div>

    <!-- Hidden audio elements (preload auto -> instant play) -->
    <audio id="originalAudio" class="audio-player" preload="auto" src="{{ song.original_file.url }}"></audio>
    <audio id="accompaniment" class="audio-player" preload="auto" src="{{ song.accompaniment_file.url }}"></audio>

    <!-- Controls (same layout) -->
    <div class="controls">
      <button id="playBtn">▶ Play Original</button>
      <button id="recordBtn">🎙 Start Recording</button>
      <button id="stopBtn" style="display:none;">⏹ Stop Recording</button>
    </div>
  </div>

  <!-- Final output overlay (after recording) -->
  <div class="final-output" id="finalOutputDiv">
    <div class="karaoke-wrapper">
      <img class="reel-bg" id="finalBg">
      <div id="finalStatus">Recording Complete!</div>
      <div class="controls">
        <button id="playRecordingBtn">▶ Play</button>
        <a id="downloadRecordingBtn" href="#" download>
          <button>⬇ Download</button>
        </a>
        <button id="newRecordingBtn">New</button>
      </div>
    </div>
  </div>

  <!-- Video player for playback -->
  <video id="recordingVideoPlayer" playsinline controls></video>
  <div class="video-controls" id="videoControls" style="display:none;">
    <button onclick="window.closeVideoPlayer()">Close</button>
    <button onclick="window.toggleFullscreen()">Fullscreen</button>
  </div>

  <!-- Hidden canvas for recording (720x1280) -->
  <canvas id="recordingCanvas" width="720" height="1280"></canvas>

  <script>
  (function() {
    "use strict";

    /* ---------- GLOBAL STATE (cleaned up, ready for instant action) ---------- */
    let mediaRecorder;
    let recordedChunks = [];
    let lastRecordingURL = null;
    let audioContext = null;
    // Web Audio nodes for recording (mic + accompaniment element)
    let micSource = null, accMediaSource = null, micGain = null, accGain = null, destination = null;
    let canvasRafId = null;
    let isRecording = false;
    let isPlayingRecording = false;
    let autoStopTimer = null;
    let micStream = null;
    let recordingStartTime = 0;
    let recordingDuration = 0;

    // Cached elements
    const playBtn = document.getElementById("playBtn");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const originalAudioEl = document.getElementById("originalAudio");
    const accompanimentEl = document.getElementById("accompaniment");
    const finalDiv = document.getElementById("finalOutputDiv");
    const mainBg = document.getElementById("mainBg");
    const finalBg = document.getElementById("finalBg");
    const finalStatus = document.getElementById("finalStatus");
    const playRecordingBtn = document.getElementById("playRecordingBtn");
    const downloadRecordingBtn = document.getElementById("downloadRecordingBtn");
    const newRecordingBtn = document.getElementById("newRecordingBtn");
    const canvas = document.getElementById("recordingCanvas");
    const ctx = canvas.getContext("2d");
    const logoImg = new Image();
    logoImg.src = document.getElementById("logoImg").src;
    const recordingVideoPlayer = document.getElementById("recordingVideoPlayer");
    const videoControls = document.getElementById("videoControls");

    // ---------- HELPER: ensure AudioContext exists and is resumed ----------
    async function resumeAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000,
          latencyHint: 'playback'
        });
      }
      if (audioContext.state === 'suspended') {
        try { await audioContext.resume(); } catch (e) { console.warn('resume failed', e); }
      }
      return audioContext;
    }

    // ---------- DRAW CANVAS (exactly as before) ----------
    function drawCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const canvasW = canvas.width;
      const canvasH = canvas.height * 0.75;   // image occupies 75% height

      const imgRatio = mainBg.naturalWidth / mainBg.naturalHeight;
      const canvasRatio = canvasW / canvasH;

      let drawW, drawH;
      if (imgRatio > canvasRatio) {
        drawW = canvasW;
        drawH = canvasW / imgRatio;
      } else {
        drawH = canvasH;
        drawW = canvasH * imgRatio;
      }

      const x = (canvasW - drawW) / 2;
      const y = 0;  // top aligned

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(mainBg, x, y, drawW, drawH);

      // logo top-left
      const logoSize = 60;
      ctx.drawImage(logoImg, 20, 20, logoSize, logoSize);

      canvasRafId = requestAnimationFrame(drawCanvas);
    }

    // ---------- CLEANUP after recording ----------
    function cleanupRecordingNodes() {
      if (accMediaSource) {
        try { accMediaSource.disconnect(); } catch (e) {}
        accMediaSource = null;
      }
      if (micSource) {
        try { micSource.disconnect(); } catch (e) {}
        micSource = null;
      }
      if (micGain) {
        try { micGain.disconnect(); } catch (e) {}
        micGain = null;
      }
      if (accGain) {
        try { accGain.disconnect(); } catch (e) {}
        accGain = null;
      }
      if (destination) {
        try { destination.disconnect(); } catch (e) {}
        destination = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      // stop accompaniment element (it was playing for recording)
      accompanimentEl.pause();
      accompanimentEl.currentTime = 0;
    }

    // ---------- STOP RECORDING (manual or auto) ----------
    function stopRecording() {
      if (!isRecording) return;
      if (autoStopTimer) {
        clearTimeout(autoStopTimer);
        autoStopTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();   // triggers onstop event
      }
      // stop monitoring original (guide) audio
      originalAudioEl.pause();
      originalAudioEl.currentTime = 0;

      cleanupRecordingNodes();

      if (canvasRafId) {
        cancelAnimationFrame(canvasRafId);
        canvasRafId = null;
      }
      isRecording = false;
      statusEl.innerText = "Processing recording...";
    }

    // ---------- PLAY ORIGINAL (INSTANT via <audio> element) ----------
    playBtn.onclick = async function() {
      // If recording is active, stop it first
      if (isRecording) stopRecording();

      if (!originalAudioEl.paused) {
        // Already playing -> pause
        originalAudioEl.pause();
        originalAudioEl.currentTime = 0;
        playBtn.innerText = "▶ Play Original";
        statusEl.innerText = "⏹ Stopped";
      } else {
        // Play original (immediate, preload done)
        try {
          await originalAudioEl.play();
          playBtn.innerText = "⏹ Stop Original";
          statusEl.innerText = "🎵 Playing original...";
        } catch (e) {
          statusEl.innerText = "❌ play failed";
          console.warn(e);
        }
      }
    };

    /* ---------- RECORD BUTTON — now uses accompanimentEl (preloaded) for instant mix ---------- */
    recordBtn.onclick = async function() {
      if (isRecording) return;

      // Stop any playing original
      if (!originalAudioEl.paused) {
        originalAudioEl.pause();
        originalAudioEl.currentTime = 0;
        playBtn.innerText = "▶ Play Original";
      }

      // Hide play/record, show stop
      playBtn.style.display = "none";
      recordBtn.style.display = "none";
      stopBtn.style.display = "inline-block";
      statusEl.innerText = "🎙 Starting (mic) ...";

      try {
        // 1. Resume audio context (fast)
        await resumeAudioContext();

        // 2. Get microphone (fast with minimal constraints)
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: true,
            autoGainControl: false,
            channelCount: 1,
            sampleRate: 48000
          },
          video: false
        });

        // 3. Build Web Audio graph using accompaniment <audio> element (already preloaded)
        //    and mic. This does NOT require decoding buffers.
        micSource = audioContext.createMediaStreamSource(micStream);

        // IMPORTANT: create MediaElementSource from accompanimentEl (karaoke track)
        // This will allow us to mix it into the recording.
        accMediaSource = audioContext.createMediaElementSource(accompanimentEl);

        micGain = audioContext.createGain();
        micGain.gain.value = 1.5;   // voice boost
        accGain = audioContext.createGain();
        accGain.gain.value = 0.8;   // accompaniment level

        destination = audioContext.createMediaStreamDestination();

        micSource.connect(micGain);
        micGain.connect(destination);
        accMediaSource.connect(accGain);
        accGain.connect(destination);

        // 4. Start canvas drawing
        drawCanvas();

        // 5. Play the accompaniment (karaoke) track – it will be heard and also fed into destination
        //    Also play the original (guide) for singer monitoring (not recorded)
        await Promise.all([
          accompanimentEl.play(),    // karaoke track (recorded)
          originalAudioEl.play()     // guide vocals (not recorded, only for singer)
        ]).catch(e => console.warn('playback start issue:', e));

        // 6. Capture canvas + mixed audio
        const canvasStream = canvas.captureStream(30);
        const audioStream = destination.stream;
        const combinedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioStream.getAudioTracks()
        ]);

        // 7. Determine best mime type
        let mimeType = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp9,opus';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp8,opus';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm';
        }

        mediaRecorder = new MediaRecorder(combinedStream, {
          mimeType: mimeType,
          audioBitsPerSecond: 256000,
          videoBitsPerSecond: 5000000
        });

        recordedChunks = [];
        recordingStartTime = Date.now();

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          // cancel canvas
          if (canvasRafId) {
            cancelAnimationFrame(canvasRafId);
            canvasRafId = null;
          }

          recordingDuration = (Date.now() - recordingStartTime) / 1000;

          // stop monitoring & accompaniment
          originalAudioEl.pause();
          originalAudioEl.currentTime = 0;
          accompanimentEl.pause();
          accompanimentEl.currentTime = 0;

          cleanupRecordingNodes();

          if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
            lastRecordingURL = url;

            finalBg.src = mainBg.src;
            finalDiv.style.display = "flex";

            const mins = Math.floor(recordingDuration / 60);
            const secs = Math.floor(recordingDuration % 60);
            finalStatus.innerText = `✅ Complete (${mins}:${secs.toString().padStart(2,'0')})`;

            let songName = "{{ song.title|default:'karaoke' }}".replace(/[^a-zA-Z0-9]/g, '_');
            let ext = mimeType.includes('mp4') ? '_KARAOKE.mp4' : '_KARAOKE.webm';
            downloadRecordingBtn.href = url;
            downloadRecordingBtn.download = songName + ext;

            // Play button inside final screen
            playRecordingBtn.onclick = () => {
              if (!isPlayingRecording) {
                recordingVideoPlayer.src = url;
                recordingVideoPlayer.style.display = 'block';
                videoControls.style.display = 'flex';
                finalDiv.style.display = 'none';
                recordingVideoPlayer.play();
                playRecordingBtn.innerText = "⏹ Stop";
                isPlayingRecording = true;

                recordingVideoPlayer.onended = () => {
                  closeVideoPlayer();
                  playRecordingBtn.innerText = "▶ Play";
                  isPlayingRecording = false;
                };
              } else {
                closeVideoPlayer();
                playRecordingBtn.innerText = "▶ Play";
                isPlayingRecording = false;
              }
            };
          }

          // restore main UI
          playBtn.style.display = "inline-block";
          recordBtn.style.display = "inline-block";
          stopBtn.style.display = "none";
          statusEl.innerText = "Ready 🎤";
          isRecording = false;
        };

        // start recorder (collect every second)
        mediaRecorder.start(1000);
        isRecording = true;
        statusEl.innerText = "🎙 Recording...";

        // Auto-stop based on accompaniment duration (if metadata loaded, else fallback)
        let durationSec = accompanimentEl.duration;
        if (!isFinite(durationSec) || durationSec <= 0) durationSec = 300; // max 5 min fallback
        const durationMs = (durationSec * 1000) + 500;
        autoStopTimer = setTimeout(() => {
          if (isRecording) {
            stopRecording();
            statusEl.innerText = "⏹ Auto-stopped";
          }
        }, durationMs);

      } catch (err) {
        console.error("Recording error:", err);
        statusEl.innerText = "❌ " + (err.message || "mic error");
        // revert UI
        playBtn.style.display = "inline-block";
        recordBtn.style.display = "inline-block";
        stopBtn.style.display = "none";
        isRecording = false;
        cleanupRecordingNodes();
      }
    };

    /* ---------- STOP button (manual) ---------- */
    stopBtn.onclick = function() {
      stopRecording();
      statusEl.innerText = "⏹ Stopped recording";
    };

    /* ---------- NEW RECORDING button (final screen) ---------- */
    newRecordingBtn.onclick = function() {
      closeVideoPlayer();  // defined below
      finalDiv.style.display = "none";

      // stop any playing original
      if (!originalAudioEl.paused) {
        originalAudioEl.pause();
        originalAudioEl.currentTime = 0;
      }
      accompanimentEl.pause();
      accompanimentEl.currentTime = 0;

      playBtn.style.display = "inline-block";
      playBtn.innerText = "▶ Play Original";
      recordBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
      statusEl.innerText = "Ready 🎤";

      recordedChunks = [];
      isRecording = false;
      isPlayingRecording = false;

      if (lastRecordingURL) {
        URL.revokeObjectURL(lastRecordingURL);
        lastRecordingURL = null;
      }

      // ensure audio context ready for next recording
      resumeAudioContext();
    };

    /* ---------- VIDEO PLAYER controls (global for onclick) ---------- */
    window.closeVideoPlayer = function() {
      if (recordingVideoPlayer) {
        recordingVideoPlayer.pause();
        recordingVideoPlayer.currentTime = 0;
        recordingVideoPlayer.style.display = 'none';
        videoControls.style.display = 'none';
        recordingVideoPlayer.src = '';
      }
      finalDiv.style.display = 'flex';
      playRecordingBtn.innerText = "▶ Play";
      isPlayingRecording = false;
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    };

    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        recordingVideoPlayer.requestFullscreen().catch(e => console.log(e));
      } else {
        document.exitFullscreen();
      }
    };

    // video tap toggle play/pause
    recordingVideoPlayer.addEventListener('click', function() {
      if (this.paused) this.play(); else this.pause();
    });

    /* ---------- PRELOAD & INIT: resume context early (just in case) ---------- */
    window.addEventListener('load', async () => {
      // resume audio context (will be suspended, but preloads buffers via elements)
      await resumeAudioContext();
      statusEl.innerText = "Ready 🎤 — tap buttons";
    });

    // any touch will resume (failsafe)
    document.addEventListener('touchstart', async () => {
      await resumeAudioContext();
    }, { once: true });

    // clean up
    window.addEventListener('beforeunload', () => {
      if (lastRecordingURL) URL.revokeObjectURL(lastRecordingURL);
      if (audioContext) audioContext.close();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
    });

    window.addEventListener('pagehide', () => {
      if (canvasRafId) cancelAnimationFrame(canvasRafId);
    });

  })();
  </script>
</body>
</html>
